# Override de producción — RDM Sovereign Stack
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  gateway:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl/visitarealdelmonte.online:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - mongodata:/data/db

  core:
    restart: unless-stopped

  admin-os:
    restart: unless-stopped

  visitor-web:
    restart: unless-stopped

  nodo-cero:
    restart: unless-stopped

volumes:
  mongodata:
