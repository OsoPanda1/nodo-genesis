# Override de producción — RDM Digital Hub
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Entorno: visitarealdelmonte.online (detrás de Cloudflare)

services:
  gateway:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl/visitarealdelmonte.online:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  core:
    restart: unless-stopped

  admin-os:
    restart: unless-stopped

  visitor-web:
    restart: unless-stopped

  nodo-cero:
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://www.visitarealdelmonte.online
      - BASE_URL=https://www.visitarealdelmonte.online
      - API_URL=https://www.visitarealdelmonte.online/api
      - NODE_ID=RDM-N0-ALPHA

volumes:
  postgres-data:
    external: false