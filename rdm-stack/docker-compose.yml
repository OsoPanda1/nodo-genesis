# RDM Digital Hub — Nodo Cero
# Uso local: docker compose up -d --build
# Orquestación unificada del ecosistema digital territorial.

name: rdm-digital-hub

services:
  # CAPA 0 · Infraestructura — Base de Datos (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: rdm-hub-db
    environment:
      POSTGRES_USER: rdm
      POSTGRES_PASSWORD: rdm
      POSTGRES_DB: rdm_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdm -d rdm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # CAPA 1 · Motor — Core (SSR TanStack Start / Bun)
  core:
    build:
      context: ./services/core
    container_name: rdm-hub-core
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgres://rdm:rdm@db:5432/rdm_db}
    ports:
      - "${CORE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # CAPA 3 · Gestión — Admin OS (SPA Vite en :3000)
  admin-os:
    build:
      context: ./apps/admin-os
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: rdm-hub-admin
    environment:
      - API_URL=http://core:8000
    ports:
      - "${ADMIN_OS_PORT:-3000}:3000"
    depends_on:
      - core
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # CAPA 4 · Interfaz Pública — Visitor Web (SPA Vite en :80)
  visitor-web:
    build:
      context: ./apps/visitor-web
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: rdm-hub-visitor
    ports:
      - "${VISITOR_PORT:-8080}:80"
    depends_on:
      - core
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # CAPA 5 · Sistema Operativo Territorial — Nodo Cero (Next.js 16)
  nodo-cero:
    build:
      context: ./infrastructure/nodo-cero
    container_name: rdm-hub-nodo
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://rdm:rdm@db:5432/rdm_db
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - BASE_URL=${BASE_URL:-http://localhost}
      - API_URL=${API_URL:-http://localhost/api}
      - NODE_ID=${NODO_ID:-RDM-N0-ALPHA}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # CAPA 6 · Gateway — Enrutador de tráfico (nginx)
  gateway:
    image: nginx:alpine
    container_name: rdm-hub-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      visitor-web:
        condition: service_healthy
      admin-os:
        condition: service_healthy
      nodo-cero:
        condition: service_healthy
    networks:
      - rdm-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

networks:
  rdm-network:
    driver: bridge