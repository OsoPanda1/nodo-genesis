# RDM Sovereign Stack — Gateway de Desarrollo (nginx)
# Ruteo:
#   /       → visitor-web (SPA turística, :80)
#   /admin  → admin-os     (SPA de gestión, :3000)
#   /api    → nodo-cero    (API territorial real, :3000)
#   /ws     → nodo-cero    (streaming Isabella, :3000)

events { worker_connections 1024; }

http {
    upstream visitor_backend { server visitor-web:80; }
    upstream admin_backend { server admin-os:3000; }
    upstream api_backend { server nodo-cero:3000; }

    server {
        listen 80;

        # Health check
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # Interfaz Pública (SPA turística)
        location / {
            proxy_pass http://visitor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sistema Operativo / Panel de gestión
        location /admin {
            rewrite ^/admin(.*)$ $1 break;
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API territorial (nodo-cero)
        location /api {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Streaming Isabella (SSE / WebSocket)
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}