<!doctype html>
<html lang="es">
  <!--
    ==================================================================
    Assets/WebGLTemplates/RDM/index.html
    ------------------------------------------------------------------
    Plantilla WebGL del RDM Digital Hub (Arena 3D Unity).
    - Carga el build de Unity (Build/RDMArena.loader.js).
    - Expone `window.rdmUnityBridge` para conectar con el host web:
      * bridge.sendMessage(gameObject, method, value)
      * bridge.onMessage(json)  (eventos de Unity hacia el host)
    ==================================================================
  -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>RDM Arena — Zombies Invasion</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #060a12; overflow: hidden; }
      #unity-container { position: absolute; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; background: #060a12; display: block; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #9db4d0; font-family: ui-monospace, monospace; font-size: 13px; }
      #unity-progress-bar-empty { width: 260px; height: 10px; border: 1px solid #1e2a3a; border-radius: 999px; overflow: hidden; margin: 12px auto 0; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); }
      #unity-footer { position: absolute; bottom: 8px; left: 12px; font-family: ui-monospace, monospace; font-size: 10px; color: #47566e; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>
    <div id="unity-loading-bar">
      <div>Cargando RDM Arena <span id="unity-progress-pct">0%</span></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-footer">RDM Digital Hub · Zombies RDM Invasion</div>

    <script>
      (function () {
        const container = document.getElementById('unity-container');
        const canvas = document.getElementById('unity-canvas');
        const progressPct = document.getElementById('unity-progress-pct');
        const progressBar = document.getElementById('unity-progress-bar-full');
        const loadingBar = document.getElementById('unity-loading-bar');

        // Bridge expuesto al host web (Next.js).
        const bridge = {
          instance: null,
          onMessage: function (msg) {
            window.dispatchEvent(new CustomEvent('rdm-unity-message', { detail: msg }));
          },
          sendMessage: function (gameObject, method, value) {
            if (this.instance && this.instance.SendMessage) {
              this.instance.SendMessage(gameObject, method, value);
            }
          },
        };
        window.rdmUnityBridge = bridge;

        const config = {
          canvas: canvas,
          dataUrl: 'Build/RDMArena.data',
          frameworkUrl: 'Build/RDMArena.framework.js',
          codeUrl: 'Build/RDMArena.wasm',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'TAMV Online Network',
          productName: 'RDM Arena — Zombies Invasion',
          productVersion: '1.0.0',
          matchWebGLToCanvasSize: false,
          devicePixelRatio: 1,
          onProgress: function (progress) {
            const pct = Math.round(progress * 100);
            progressPct.textContent = pct + '%';
            progressBar.style.width = pct + '%';
          },
        };

        function loadUnity() {
          const loader = document.createElement('script');
          loader.src = 'Build/RDMArena.loader.js';
          loader.onload = function () {
            createUnityInstance(canvas, config)
              .then(function (instance) {
                bridge.instance = instance;
                loadingBar.style.display = 'none';
              })
              .catch(function (err) {
                console.error('[RDM-UNITY] fallo al crear instancia:', err);
                loadingBar.innerHTML = '<div style="color:#f87171">Error al cargar la arena 3D.</div>';
              });
          };
          document.body.appendChild(loader);
        }

        if (/Complete|Loaded|Interactive/.test(document.readyState)) {
          loadUnity();
        } else {
          document.addEventListener('DOMContentLoaded', loadUnity);
        }
      })();
    </script>
  </body>
</html>
